name = "odysseus"
description = "Self-hosted AI workspace: a FastAPI backend and a large first-party front end covering chat, an agent loop with a tool surface, email, calendar, documents and RAG, memory, research, model serving, and MCP. Python 3.11+ with a stdlib-plus-FastAPI backend."
repo_url = "https://github.com/odysseus-dev/odysseus"
primary_language = "python"
repo_path = "/home/lhl/github/lhl/odysseus"

notes = "Odysseus has no Makefile or package.json, so the gate table detects no invocable targets; the real gates are the GitHub Actions jobs in .github/workflows/ci.yml. `check` is the syntax and test job: compileall over every source root, node --check over the first-party JS, then the full pytest suite. CI also runs CodeQL, a secret scan, container scanning, a dependency review, and a workflow-security audit; those need network or credentials and are not local gates. Two paths are generated or vendored rather than written: services/hwfit/data/*.json is a 35k-line model catalogue, and static/lib/ holds minified third-party bundles (docx, mermaid, highlight, KaTeX). They are listed for coverage and should not be read as first-party code."

# The keys above describe the repository; this table records the snapshot.
# This file is the run's only configuration; editing it changes the run.
[run]
tool_version = 1
created_at = "2026-10-03T14:40:16+00:00"
audit_date = "2026-10-03"
commit = "2992bf6d368a11472323e47d3bfed91e79cefc6b"

# Values the secret gate reads as credentials but that are not.
[secrets.allow]
"_token_cache" = "attribute name assigned in app.py; the same string is a fragment of tests/test_token_cache_*.py and tests/*_token_cache_*.py paths listed for coverage, not a credential"
"api_key_manager" = "module name (src/api_key_manager.py) and a fragment of tests/test_api_key_manager_*.py paths listed for coverage, not a credential"
"odysseus-theme" = "localStorage key in static/js/theme.js; the same string is the scripts/odysseus-theme script path listed for coverage, not a credential"
"manage_tokens" = "agent tool name in the TOOL_HANDLERS registry and the tool-name map in src/tool_parsing.py; the secret pattern reads the map entry as a token assignment, not a credential"
"access_token" = "OAuth field name; routes/chatgpt_subscription_routes.py:26 reads tokens.get(\"access_token\") and core/database.py:565 names the column, so the pattern reads the literal field name as a credential"
"refresh_token" = "OAuth field name; routes/chatgpt_subscription_routes.py:27 reads tokens.get(\"refresh_token\") and core/database.py:566 names the column, so the pattern reads the literal field name as a credential"
"oauth_tokens" = "MCP server column name (core/database.py:584) and the test fixture attribute in tests/test_mcp_oauth.py:90; the pattern reads the literal column name as a credential"
"brave_api_key" = "settings key name (src/settings.py:91) read by services/search/providers.py:296 as config.get(\"brave_api_key\"); the pattern reads the literal key name as a credential"
"SameSite=Lax" = "cookie attribute value in the prose at companion/routes.py:172; the secret pattern reads `credential: SameSite=Lax` as an assignment, not a credential"
"req.hf_token" = "attribute reference (the ServeRequest field) at routes/cookbook_routes.py:1084 and :1977, quoted in the cookbook section's evidence; the pattern reads the attribute name as a credential value, not a credential"
"sess.headers" = "attribute reference (the request-header dict on a chat session) at routes/webhook/webhook_routes.py:372 and :383, quoted in the src-llm-core section's evidence; the pattern reads the attribute name as a credential value after matching `if api_key:` and the next line, not a credential"

[gates]
check = "python -m compileall -q app.py core routes src services scripts tests && python -m pytest -q"
release = "docker compose config"

